<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>温湿度监控面板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{padding:30px;font-family:system-ui}
    .box{max-width:900px;margin:0 auto}
    .info{font-size:22px;margin-bottom:20px}
    canvas{height:350px}
  </style>
</head>
<body>
<div class="box">
  <div class="info">
    设备编号：<span id="devId">--</span> <br>
    当前温度：<span id="temp">--</span> ℃ <br>
    当前湿度：<span id="humi">--</span> %RH
  </div>
  <canvas id="chart"></canvas>
</div>

<script>
const ws = new WebSocket(`ws://${location.host}`);
const ctx = document.getElementById('chart').getContext('2d');
const tempList = [];
const humiList = [];
const labelList = [];
const maxLen = 15;

const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: labelList,
    datasets: [
      {label:"温度(℃)", data:tempList, borderColor:"#f44", fill:false},
      {label:"湿度(%)", data:humiList, borderColor:"#28f", fill:false}
    ]
  },
  options: {responsive:true}
});

ws.onmessage = (e)=>{
  const obj = JSON.parse(e.data);
  document.getElementById("devId").innerText = obj.deviceId;
  document.getElementById("temp").innerText = obj.temperature;
  document.getElementById("humi").innerText = obj.humidity;

  const time = new Date().toLocaleTimeString();
  labelList.push(time);
  tempList.push(Number(obj.temperature));
  humiList.push(Number(obj.humidity));

  if(labelList.length > maxLen){
    labelList.shift();
    tempList.shift();
    humiList.shift();
  }
  chart.update();
}
</script>
</body>
</html>
