<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT 温湿度监控</title>
  <script src="/vendor/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #16233f 0%, #0b1220 45%, #070b14 100%);
      color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      max-width: 1180px;
      margin: 0 auto 20px;
    }

    h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }

    .subtitle { margin-top: 6px; font-size: 13px; color: #7c8ba1; }
    .subtitle span { color: #38bdf8; }

    .status { display: flex; gap: 10px; flex-wrap: wrap; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #111a2e;
      border: 1px solid #1e293b;
      font-size: 12px;
      color: #94a3b8;
    }

    .pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      transition: background 0.2s;
    }

    .pill.online .dot { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.7); }
    .pill.offline .dot { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.7); }
    .pill.connecting .dot { background: #f59e0b; }

    main {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(2, 1fr);
    }

    .cards {
      grid-column: 1 / -1;
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(2, 1fr);
    }

    .card, .panel {
      background: rgba(17, 26, 46, 0.82);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(6px);
    }

    .card .label { font-size: 13px; color: #7c8ba1; letter-spacing: 1px; }

    .value {
      margin-top: 10px;
      font-size: 40px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .value .unit { font-size: 16px; font-weight: 500; color: #64748b; margin-left: 6px; }

    #temp { color: #38bdf8; }
    #humidity { color: #34d399; }

    .meta {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: #64748b;
    }

    .chart-panel, .log-panel { min-width: 0; }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-head h2 { font-size: 15px; font-weight: 600; color: #cbd5e1; }
    .hint { font-size: 12px; color: #52617a; }

    #chart { width: 100%; height: 340px; }

    .chart-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
      font-size: 13px;
      text-align: center;
    }

    #log { list-style: none; max-height: 340px; overflow-y: auto; }

    #log li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px dashed #1e293b;
      font-size: 13px;
      color: #94a3b8;
    }

    #log li:last-child { border-bottom: none; }
    #log li .log-time { color: #64748b; font-variant-numeric: tabular-nums; }
    #log li .log-value { color: #cbd5e1; font-variant-numeric: tabular-nums; }
    #log li.empty { justify-content: center; color: #52617a; }

    @media (max-width: 820px) {
      body { padding: 16px; }
      main, .cards { grid-template-columns: 1fr; }
      .value { font-size: 32px; }
      #chart { height: 280px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>IoT 温湿度监控</h1>
      <p class="subtitle">MQTT 主题：<span id="topic">--</span></p>
    </div>
    <div class="status">
      <span class="pill connecting" id="ws-status"><i class="dot"></i>页面连接</span>
      <span class="pill connecting" id="broker-status"><i class="dot"></i>MQTT Broker</span>
    </div>
  </header>

  <main>
    <section class="cards">
      <div class="card">
        <div class="label">温度</div>
        <div class="value"><span id="temp">--</span><span class="unit">°C</span></div>
        <div class="meta">
          <span id="device">设备：--</span>
          <span id="time">--</span>
        </div>
      </div>
      <div class="card">
        <div class="label">湿度</div>
        <div class="value"><span id="humidity">--</span><span class="unit">%</span></div>
        <div class="meta">
          <span id="humidity-device">设备：--</span>
          <span id="humidity-time">--</span>
        </div>
      </div>
    </section>

    <section class="panel chart-panel">
      <div class="panel-head">
        <h2>实时趋势</h2>
        <span class="hint">最近 50 个采样点</span>
      </div>
      <div id="chart"></div>
    </section>

    <section class="panel log-panel">
      <div class="panel-head">
        <h2>最新消息</h2>
        <span class="hint">最近 10 条</span>
      </div>
      <ul id="log"><li class="empty">等待数据...</li></ul>
    </section>
  </main>

  <script>
    const MAX_POINTS = 50;
    const MAX_LOG = 10;
    const $ = (id) => document.getElementById(id);

    const times = [];
    const temps = [];
    const hums = [];

    let chart = null;
    if (window.echarts) {
      chart = echarts.init($('chart'));
      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'axis',
          backgroundColor: '#0f172a',
          borderColor: '#1e293b',
          textStyle: { color: '#e2e8f0' }
        },
        legend: {
          data: ['温度 (°C)', '湿度 (%)'],
          textStyle: { color: '#94a3b8' },
          top: 0
        },
        grid: { left: 48, right: 56, top: 44, bottom: 32 },
        xAxis: {
          type: 'category',
          boundaryGap: false,
          data: times,
          axisLine: { lineStyle: { color: '#334155' } },
          axisLabel: { color: '#64748b' }
        },
        yAxis: [
          {
            type: 'value',
            name: '温度 °C',
            scale: true,
            nameTextStyle: { color: '#38bdf8' },
            axisLabel: { color: '#64748b' },
            splitLine: { lineStyle: { color: 'rgba(51, 65, 85, 0.45)' } }
          },
          {
            type: 'value',
            name: '湿度 %',
            scale: true,
            nameTextStyle: { color: '#34d399' },
            axisLabel: { color: '#64748b' },
            splitLine: { show: false }
          }
        ],
        series: [
          {
            name: '温度 (°C)',
            type: 'line',
            smooth: true,
            symbol: 'none',
            data: temps,
            itemStyle: { color: '#38bdf8' },
            lineStyle: { width: 2 },
            areaStyle: { opacity: 0.12, color: '#38bdf8' }
          },
          {
            name: '湿度 (%)',
            type: 'line',
            smooth: true,
            symbol: 'none',
            yAxisIndex: 1,
            data: hums,
            itemStyle: { color: '#34d399' },
            lineStyle: { width: 2 }
          }
        ]
      });
      window.addEventListener('resize', () => chart.resize());
    } else {
      $('chart').innerHTML = '<div class="chart-empty">图表库加载失败，请检查网络后刷新页面</div>';
    }

    function setStatus(el, state) {
      el.className = 'pill ' + state;
    }

    function fmtTime(ts) {
      const date = ts ? new Date(Number(ts)) : new Date();
      if (Number.isNaN(date.getTime())) return '--';
      return date.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function toNumber(value) {
      if (value === null || value === undefined || value === '') return null;
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    }

    function renderLatest(item, temp, hum) {
      $('temp').textContent = temp === null ? '--' : temp.toFixed(2);
      $('humidity').textContent = hum === null ? '--' : hum.toFixed(2);

      const device = item.deviceId || '--';
      const time = fmtTime(item.ts);
      $('device').textContent = '设备：' + device;
      $('humidity-device').textContent = '设备：' + device;
      $('time').textContent = time;
      $('humidity-time').textContent = time;
    }

    function addLog(time, temp, hum) {
      const list = $('log');
      const empty = list.querySelector('.empty');
      if (empty) empty.remove();

      const li = document.createElement('li');
      const value = `温度 ${temp === null ? '--' : temp.toFixed(2)}°C / 湿度 ${hum === null ? '--' : hum.toFixed(2)}%`;
      li.innerHTML = `<span class="log-time">${time}</span><span class="log-value">${value}</span>`;
      list.prepend(li);

      while (list.children.length > MAX_LOG) {
        list.lastElementChild.remove();
      }
    }

    function updateChart() {
      if (!chart) return;
      chart.setOption({
        xAxis: { data: times },
        series: [{ data: temps }, { data: hums }]
      });
    }

    function appendData(item) {
      const temp = toNumber(item.temperature);
      const hum = toNumber(item.humidity);
      const time = fmtTime(item.ts);

      times.push(time);
      temps.push(temp);
      hums.push(hum);
      if (times.length > MAX_POINTS) {
        times.shift();
        temps.shift();
        hums.shift();
      }

      renderLatest(item, temp, hum);
      addLog(time, temp, hum);
      updateChart();
    }

    function resetData() {
      times.length = 0;
      temps.length = 0;
      hums.length = 0;
      $('log').innerHTML = '<li class="empty">等待数据...</li>';
      $('temp').textContent = '--';
      $('humidity').textContent = '--';
      $('device').textContent = '设备：--';
      $('humidity-device').textContent = '设备：--';
      $('time').textContent = '--';
      $('humidity-time').textContent = '--';
      updateChart();
    }

    function handleMessage(raw) {
      let msg;
      try {
        msg = JSON.parse(raw);
      } catch (err) {
        return;
      }

      if (msg.type === 'hello') {
        $('topic').textContent = msg.topic || '--';
        setStatus($('broker-status'), msg.brokerConnected ? 'online' : 'offline');
        resetData();
        if (Array.isArray(msg.history)) {
          msg.history.forEach(appendData);
        }
      } else if (msg.type === 'data' && msg.payload) {
        appendData(msg.payload);
      } else if (msg.type === 'broker') {
        setStatus($('broker-status'), msg.connected ? 'online' : 'offline');
      }
    }

    function connect() {
      setStatus($('ws-status'), 'connecting');
      const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
      const ws = new WebSocket(protocol + location.host + '/ws');

      ws.onopen = () => setStatus($('ws-status'), 'online');
      ws.onmessage = (event) => handleMessage(event.data);
      ws.onerror = () => ws.close();
      ws.onclose = () => {
        setStatus($('ws-status'), 'offline');
        setTimeout(connect, 2000);
      };
    }

    connect();
  </script>
</body>
</html>
